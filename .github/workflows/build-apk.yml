name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Salin file game ke proyek Android
        run: |
          mkdir -p android/app/src/main/assets
          cp -r index.html manifest.json icon-192.png icon-512.png css js android/app/src/main/assets/

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Beri nama APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk BloxBlastMini.apk
          sha256sum BloxBlastMini.apk > BloxBlastMini.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: BloxBlastMini-apk
          path: |
            BloxBlastMini.apk
            BloxBlastMini.apk.sha256

      - name: Terbitkan ke Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Blox Blast Mini (APK terbaru)
          make_latest: true
          files: |
            BloxBlastMini.apk
            BloxBlastMini.apk.sha256
