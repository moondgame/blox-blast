name: Build APK dan AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Salin file game ke proyek Android
        run: |
          mkdir -p android/app/src/main/assets
          cp -r index.html privacy.html delete-account.html manifest.json icon-192.png icon-512.png css js android/app/src/main/assets/

      # Jika secret kunci tanda tangan sudah diisi (lihat PLAY-STORE.md), build rilis bertanda tangan dibuat.
      - name: Siapkan kunci tanda tangan (jika ada)
        id: ks
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build AAB dan APK rilis (bertanda tangan)
        if: steps.ks.outputs.signed == 'true'
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease assembleRelease --no-daemon -PversionCode=$VERSION_CODE -PversionName=1.0.$VERSION_CODE

      # Tanpa ini, tiap build membuat kunci debug baru dan Android menolak memasang APK baru di atas yang lama.
      - name: Pakai kunci debug yang sama di setiap build
        if: steps.ks.outputs.signed != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Build APK debug (tanpa kunci rilis)
        if: steps.ks.outputs.signed != 'true'
        working-directory: android
        run: gradle assembleDebug --no-daemon -PversionCode=$VERSION_CODE -PversionName=1.0.$VERSION_CODE

      - name: Kumpulkan berkas hasil build
        run: |
          mkdir -p out
          if [ "${{ steps.ks.outputs.signed }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk out/BloxBlastMini.apk
            cp android/app/build/outputs/bundle/release/app-release.aab out/BloxBlastMini.aab
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk out/BloxBlastMini.apk
          fi
          (cd out && sha256sum BloxBlastMini.apk > BloxBlastMini.apk.sha256)

      # AAB (untuk Google Play) hanya disimpan sebagai artifact workflow, tidak dipublikasikan di Releases.
      - uses: actions/upload-artifact@v4
        with:
          name: BloxBlastMini-build
          path: out/*

      - name: Terbitkan APK ke Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Blox Blast Mini (APK terbaru)
          make_latest: true
          files: |
            out/BloxBlastMini.apk
            out/BloxBlastMini.apk.sha256
